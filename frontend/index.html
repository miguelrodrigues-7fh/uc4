<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Cadastro de Usuário</h1>
    <section>
        <h3>Novo Usuário</h3>
        <form id="formUsuario">
            <input style="display: none;" type="hiden" id="usuarioID">
            <div>
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Digite o nome" required>
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Digite o email" required>
            </div>
            <div>
            <button type="submit" id="botaoSalvar">Cadastrar</button>
            </div>
        </form>
    
    </section>
    <section>
        <h3>Usuários Cadastrados</h3>
        <div id="verificador"></div>
        <div id="mensagem"></div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>nome</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="listaUsuarios"></tbody>
        </table>
    </section>
    <script src="./script.js"></script>
</body>
</html>
